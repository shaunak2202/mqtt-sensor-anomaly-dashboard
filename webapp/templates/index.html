<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MQTT Sensor Anomaly Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1117;
      color: #e6e6e6;
      margin: 0;
      padding: 24px;
    }
    h1 { margin: 0 0 4px; font-size: 22px; }
    .subtitle { color: #9aa0a6; margin-bottom: 24px; font-size: 14px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
      gap: 20px;
    }
    .card {
      background: #171a23;
      border: 1px solid #262a36;
      border-radius: 10px;
      padding: 16px 18px;
    }
    .card h2 {
      margin: 0 0 8px;
      font-size: 16px;
      text-transform: capitalize;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .stat-line {
      font-size: 12px;
      color: #9aa0a6;
      margin-bottom: 10px;
    }
    .anomaly-badge {
      background: #3a1620;
      color: #ff6b81;
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 12px;
    }
    canvas { max-height: 240px; }
    .empty-note {
      color: #9aa0a6;
      font-size: 13px;
      margin-top: 40px;
    }
  </style>
</head>
<body>
  <h1>MQTT Sensor Anomaly Dashboard</h1>
  <div class="subtitle">Live readings from simulated MQTT sensors, refreshed every few seconds. Red points are flagged anomalies (rolling z-score / EWMA detector).</div>

  <div id="grid" class="grid"></div>
  <div id="empty" class="empty-note" style="display:none;">
    No sensors found yet. Make sure the subscriber and simulator are running,
    then refresh this page.
  </div>

  <script src="{{ url_for('static', filename='dashboard.js') }}"></script>
</body>
</html>
